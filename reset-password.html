<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b2a">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset password</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css.css?v=20261008-reset-1">
  <style>
    body{min-height:100vh;margin:0;background:linear-gradient(145deg,#eef3ef,#f7f8f5);display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,sans-serif;color:#183528}
    .reset-card{width:min(100%,440px);box-sizing:border-box;background:#fff;border:1px solid #dfe8e1;border-radius:22px;padding:clamp(24px,6vw,40px);box-shadow:0 24px 70px #153b2a18}
    .reset-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#123b2a;color:white;font-size:23px;margin-bottom:22px}
    h1{margin:0 0 10px;font-size:clamp(27px,5vw,34px);letter-spacing:-.04em}
    .copy{color:#607267;line-height:1.6;margin:0 0 26px}
    label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
    input{width:100%;box-sizing:border-box;border:1px solid #cdd9d0;border-radius:11px;padding:14px;font:inherit;outline:none}
    input:focus{border-color:#28734d;box-shadow:0 0 0 3px #28734d1a}
    button,.back{width:100%;box-sizing:border-box;display:block;margin-top:18px;border:0;border-radius:11px;padding:14px 16px;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
    button{background:#123b2a;color:white}
    button:disabled{opacity:.65;cursor:wait}
    .back{color:#28503b;background:#eef3ef}
    .message{margin:16px 0 0;padding:12px 14px;border-radius:10px;line-height:1.5;font-size:14px;background:#edf6ef;color:#225b35;overflow-wrap:anywhere}
    .message.error{background:#fff0ed;color:#9b2f23}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="reset-card">
    <div class="reset-mark" aria-hidden="true">&#128274;</div>
    <h1>Reset your password</h1>
    <p class="copy">Choose a new password for your account. This secure page works independently of any business website.</p>
    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter it again">
      <button id="saveButton" type="submit">Save new password</button>
    </form>
    <p id="status" class="message" role="status">Checking your secure reset link…</p>
    <a class="back" href="/">Back to sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    (() => {
      "use strict";
      const SUPABASE_URL = "https://wfxuxrvygyzonkflpwoq.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_e2h4t8AvCobzftt36UrDbw_NJGq8qlJ";
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true,
          storage: window.localStorage, storageKey: "dfl-admin-auth" }
      });
      const form = document.getElementById("resetForm");
      const status = document.getElementById("status");
      const saveButton = document.getElementById("saveButton");
      let recoveryReady = false;
      let consumed = false;
      function message(text, error = false) {
        status.textContent = text;
        status.classList.toggle("error", error);
        status.hidden = false;
      }
      function showForm() {
        recoveryReady = true;
        form.hidden = false;
        message("Your reset link is verified. Choose a new password below.");
      }
      client.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          showForm();
        }
      });
      (async () => {
        const hash = new URLSearchParams(location.hash.slice(1));
        if (hash.has("error") || hash.has("error_description")) {
          const detail = hash.get("error_description") || "This reset link is invalid or has expired.";
          history.replaceState({}, "", location.pathname);
          message(detail + " Please return to sign in and request a new reset link.", true);
          return;
        }
        try {
          const { data, error } = await client.auth.getSession();
          if (error) throw error;
          if (data.session && (hash.get("type") === "recovery" || hash.has("access_token") || recoveryReady)) {
            showForm();
          } else if (!data.session) {
            message("Open this page from the newest password-reset email. If the link expired, return to sign in and request another.", true);
          } else {
            message("To change your password, open this page from a password-reset email.", true);
          }
        } catch (error) {
          message(error && error.message ? error.message : "This reset link could not be verified. Request a new link.", true);
        }
      })();
      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (!recoveryReady || consumed) return;
        const password = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;
        if (password.length < 8) return message("Use at least 8 characters.", true);
        if (password !== confirm) return message("The passwords do not match.", true);
        saveButton.disabled = true;
        saveButton.textContent = "Saving…";
        try {
          const { error } = await client.auth.updateUser({ password });
          if (error) throw error;
          consumed = true;
          form.reset();
          form.hidden = true;
          history.replaceState({}, "", location.pathname);
          message("Password updated successfully. Return to sign in using your new password.");
          await client.auth.signOut();
        } catch (error) {
          message(error && error.message ? error.message : "Could not update the password. Request a new reset link.", true);
        } finally {
          saveButton.disabled = false;
          saveButton.textContent = "Save new password";
        }
      });
    })();
  </script>
</body>
</html>
